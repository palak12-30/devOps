services:
  metrics:
    build:
      context: .
    image: devops-delivery-metrics:lab06
    environment:
      ALERT_DEMO: ${ALERT_DEMO:-false}
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped

  prometheus:
    build:
      context: .
      dockerfile: Dockerfile.prometheus
    image: devops-prometheus:lab06
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
    depends_on:
      - metrics
    restart: unless-stopped

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
    image: devops-grafana:lab06
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
